[project]
name = "manga-recommender"
version = "0.1.0"
description = "Manga recommendation engine"
requires-python = ">=3.14"

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    # Config / settings
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # HTTP client
    "httpx>=0.27",
    "typer>=0.24.1",
    "structlog>=26.1.0",
    "aiolimiter>=1.2.1",
]

# ─────────────────────────────────────────────────────────────────
#  DEPENDENCY GROUPS
#
#  uv sync                   | base + dev  (default, for local work)
#  uv sync --no-dev          | base only   (Docker)
#  uv sync --group pipeline  | base + pipeline  (run ingestion)
#  uv sync --group ml        | base + ml   (Phase 2 model training)
#  uv sync --all-groups      | everything  (CI or full local setup)
#
#  Add new packages to the narrowest group that needs them.
# ─────────────────────────────────────────────────────────────────
[dependency-groups]

dev = [
    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.15.0",

    # Linting / formatting
    "ruff>=0.4",
    "mypy>=1.10",

    # Type stubs
    "types-psycopg2",
]

pipeline = [
    "asyncio-throttle>=1.0",
    "tenacity>=8.0",
    "rich>=13.0",
]

ml = [
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "tqdm>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 88
# isort first-party detection: the package lives in backend/, not the default src/
src = [".", "backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["E501", "D203", "D213"] # line length handled by formatter; D203/D213 conflict with D211/D212

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["D100"] # boilerplate, not public API
"alembic/versions/*.py" = ["D400", "D415"] # auto-generated
"tests/**" = ["D"] # tests documented by their names

[tool.mypy]
python_version = "3.14"
strict = false # flip to true once the codebase is stable
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend/manga_recommender"]
