name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deploys. A cancelled run can apply migrations without rolling out the image.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # OIDC token for azure/login

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_FQDN }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag with the SHA. `az containerapp update` needs a changed image reference.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen --no-dev

      # Migrate from the runner. Replicas start unpredictably at min-replicas 0.
      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          DB_URL: ${{ secrets.DB_URL }}

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image
        run: |
          az containerapp update \
            --name manga-rec-api \
            --resource-group rg-manga-rec \
            --image ghcr.io/${{ github.repository }}:${{ github.sha }}

      # Retries cover the cold start at min-replicas 0.
      - name: Smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 10 --retry-all-errors \
            "https://${{ vars.APP_FQDN }}/ready"
